name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time: two runs for one push once raced on the release.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        id: build
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug -PbuildSha="${GITHUB_SHA}" --stacktrace --console=plain > build.log 2>&1
          echo "exit=$?" >> build.log
          tail -n 120 build.log
          grep -q '^exit=0$' build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/baselineProfiles/0/*.dm
      - name: Publish rolling "latest" release (used by the in-app updater)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk /tmp/Launcher.apk
          # The baseline profile's dex metadata (the build is not debuggable): the updater installs it with the APK, so
          # Android compiles the profiled code at install.
          dm=app/build/outputs/apk/debug/baselineProfiles/0/app-debug.dm
          if [ -f "$dm" ]; then cp "$dm" /tmp/Launcher.dm; fi
          files="/tmp/Launcher.apk"; if [ -f /tmp/Launcher.dm ]; then files="$files /tmp/Launcher.dm"; fi
          # One release, updated in place. Deleting it with its tag and creating it again at once left it a draft (not
          # public: the phone's updater got 404): GitHub deletes the tag in the background, after the new release took it.
          if gh release view latest >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true >/dev/null               || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref=refs/tags/latest -f sha="${GITHUB_SHA}" >/dev/null
            gh release upload latest $files --clobber
            gh release edit latest --draft=false --prerelease --title "latest build" --notes "${GITHUB_SHA}"
          else
            gh release create latest $files --prerelease --target "${GITHUB_SHA}" --title "latest build" --notes "${GITHUB_SHA}"
            gh release edit latest --draft=false --prerelease
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '"release: draft=\(.draft) notes=\(.body)"'
      - name: Publish build log to the ci-logs branch (readable without pasting logs)
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          touch build.log
          mkdir -p /tmp/out && cp build.log /tmp/out/build.log
          echo "commit: ${GITHUB_SHA}" > /tmp/out/STATUS.txt
          echo "result: ${{ steps.build.outcome }}" >> /tmp/out/STATUS.txt
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/* .
          git add build.log STATUS.txt
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f origin ci-logs
