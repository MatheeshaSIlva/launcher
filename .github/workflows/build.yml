name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        id: build
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleDebug -PbuildSha="${GITHUB_SHA}" --stacktrace --console=plain > build.log 2>&1
          echo "exit=$?" >> build.log
          tail -n 120 build.log
          grep -q '^exit=0$' build.log
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish rolling "latest" release (used by the in-app updater)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk /tmp/Launcher.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest /tmp/Launcher.apk --prerelease --target "${GITHUB_SHA}" \
            --title "latest build" --notes "${GITHUB_SHA}"
          # gh creates the release as a draft, uploads, then publishes; once the publish did not stick (a draft is not
          # public: the phone's updater got 404). Publish explicitly and check the public download.
          for i in 1 2 3 4 5; do
            gh release edit latest --draft=false --prerelease || true
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/Launcher.apk")
            echo "public download: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ]
      - name: Publish build log to the ci-logs branch (readable without pasting logs)
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          touch build.log
          mkdir -p /tmp/out && cp build.log /tmp/out/build.log
          echo "commit: ${GITHUB_SHA}" > /tmp/out/STATUS.txt
          echo "result: ${{ steps.build.outcome }}" >> /tmp/out/STATUS.txt
          git checkout --orphan ci-logs
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/* .
          git add build.log STATUS.txt
          git commit -m "build log for ${GITHUB_SHA}"
          git push -f origin ci-logs
