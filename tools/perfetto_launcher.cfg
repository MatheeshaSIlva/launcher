# Perfetto config for the launcher: scheduling, CPU frequency, the app's own trace sections, graphics, input, window
# manager and SurfaceFlinger's frame timeline. Used by tools/trace.sh.
buffers: { size_kb: 98304 fill_policy: RING_BUFFER }
buffers: { size_kb: 4096 fill_policy: RING_BUFFER }
data_sources: {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "power/suspend_resume"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "input"
      atrace_categories: "wm"
      atrace_categories: "am"
      atrace_categories: "dalvik"
      atrace_categories: "res"
      atrace_categories: "hal"
      atrace_apps: "dev.launcher.app"
    }
  }
}
data_sources: { config { name: "android.surfaceflinger.frametimeline" target_buffer: 0 } }
data_sources: {
  config {
    name: "linux.process_stats"
    target_buffer: 1
    process_stats_config { scan_all_processes_on_start: true }
  }
}
